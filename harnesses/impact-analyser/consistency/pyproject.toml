[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stlc-consistency-harness"
version = "0.1.0"
description = "Multi-agent harness that measures impact-report consistency for the Agentic AI STLC analyser"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
consistency-harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
